components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: sessionId
    hostAgentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque shared token
  parameters:
    NumericID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ConversationID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    MessageID:
      name: messageId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ChatSource:
      name: source
      in: path
      required: true
      schema: { type: string, enum: [internal-chat, customer-chat] }
  responses:
    Unauthorized:
      description: 会话缺失、无效或已过期。
    Forbidden:
      description: 已登录用户缺少所需菜单、动作或所有权权限。
  schemas:
    PublicPagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    PublicDaily:
      type: object
      required: [id, content, authorName, isPrivate, views, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1 }
        content: { type: string, description: 经过白名单清洗的富文本 HTML，用户可见文字最多 2000 个 Unicode 字符 }
        authorName: { type: string, description: 发布人的公开展示名称 }
        isPrivate: { type: boolean, description: 是否仅发布人本人可见 }
        views: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicDailyRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, description: 待发布的富文本 HTML；服务端会清洗危险标签并限制用户可见文字最多 2000 个 Unicode 字符 }
        isPrivate: { type: boolean, default: false, description: 是否仅发布人本人可见 }
    PublicFileCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500, description: 去除首尾空白后保存的纯文本评论 }
    PublicFileTagRequest:
      type: object
      required: [tag]
      properties:
        tag: { type: string, minLength: 1, maxLength: 24, description: '去首尾空白、去前导 # 后按不区分大小写去重' }
    PublicFileTagResponse:
      type: object
      required: [tags, added]
      properties:
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 24 }
        added: { type: boolean, description: 重复标签或图片已有十二个标签时为 false }
    PublicFileComment:
      type: object
      required: [id, userName, content, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        userName: { type: string, description: 评论作者展示名称 }
        content: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
    PublicFileInteraction:
      type: object
      required: [likeCount, likedByCurrentUser, comments]
      properties:
        likeCount: { type: integer, minimum: 0 }
        likedByCurrentUser: { type: boolean, description: 匿名请求固定为 false }
        comments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PublicFileComment' }
    FileMetadataRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, description: 管理端展示名称 }
        category: { type: string, description: 文件分类 }
        description: { type: string, description: 文件说明 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 24, description: '去首尾空白、去前导 # 后按不区分大小写去重' }
        isPrivate: { type: boolean }
        is18r: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RegisterCodeRequest:
      type: object
      required: [username, email]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email }
    RegisterRequest:
      type: object
      required: [username, password, email, code]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, format: password, minLength: 6 }
        email: { type: string, format: email }
        code: { type: string, minLength: 1 }
    InternalChatMessageRequest:
      type: object
      properties:
        recipientId:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: 'null' }
        content: { type: string, maxLength: 2000 }
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: integer, minimum: 1 }
    ServerConnectionSummary:
      type: object
      required: [available, sampled, truncated, tcp, udp, established, listen, timeWait, closeWait]
      properties:
        available: { type: boolean }
        sampled: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        tcp: { type: integer, minimum: 0 }
        udp: { type: integer, minimum: 0 }
        established: { type: integer, minimum: 0 }
        listen: { type: integer, minimum: 0 }
        timeWait: { type: integer, minimum: 0 }
        closeWait: { type: integer, minimum: 0 }
    ServerConnectionDetails:
      type: object
      required: [available, warning, sampled, truncated, detailsTruncated, summary, connections, sampledAt]
      properties:
        available: { type: boolean }
        warning: { type: string }
        sampled: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        detailsTruncated: { type: boolean }
        summary: { $ref: '#/components/schemas/ServerConnectionSummary' }
        connections:
          type: array
          maxItems: 500
          items:
            type: object
            required: [protocol, addressFamily, localAddress, localPort, remoteAddress, remotePort, status, pid, processName]
            properties:
              protocol: { type: string }
              addressFamily: { type: string }
              localAddress: { type: string }
              localPort: { type: integer, minimum: 0 }
              remoteAddress: { type: string }
              remotePort: { type: integer, minimum: 0 }
              status: { type: string }
              pid: { type: integer, minimum: 0 }
              processName: { type: string }
        sampledAt: { type: string, format: date-time }
    ServerMetrics:
      type: object
      required: [scope, hostname, os, platform, platformVersion, kernelVersion, architecture, uptimeSeconds, bootedAt, cpu, load, memory, disk, partitions, diskIO, network, process, temperatures, health, collectionWarnings, sampledAt]
      properties:
        scope: { type: string, enum: [host, container] }
        hostname: { type: string }
        os: { type: string }
        platform: { type: string }
        platformVersion: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        bootedAt: { type: string, format: date-time }
        virtualizationSystem: { type: string }
        virtualizationRole: { type: string }
        cpu:
          type: object
          required: [logicalCores, physicalCores, usagePercent, perCoreUsagePercent, times]
          properties:
            logicalCores: { type: integer, minimum: 1 }
            physicalCores: { type: integer, minimum: 0 }
            usagePercent: { type: number, minimum: 0, maximum: 100 }
            perCoreUsagePercent:
              type: array
              items: { type: number, minimum: 0, maximum: 100 }
            modelName: { type: string }
            vendorId: { type: string }
            frequencyMHz: { type: number, minimum: 0 }
            cacheSizeKB: { type: integer, minimum: 0 }
            times:
              type: object
              properties:
                userSeconds: { type: number, minimum: 0 }
                systemSeconds: { type: number, minimum: 0 }
                idleSeconds: { type: number, minimum: 0 }
                ioWaitSeconds: { type: number, minimum: 0 }
                irqSeconds: { type: number, minimum: 0 }
                softIrqSeconds: { type: number, minimum: 0 }
                stealSeconds: { type: number, minimum: 0 }
        load:
          type: object
          properties:
            load1: { type: number, minimum: 0 }
            load5: { type: number, minimum: 0 }
            load15: { type: number, minimum: 0 }
            processTotal: { type: integer, minimum: 0 }
            processRunning: { type: integer, minimum: 0 }
            processBlocked: { type: integer, minimum: 0 }
            processesCreated: { type: integer, minimum: 0 }
            contextSwitches: { type: integer, minimum: 0 }
        memory:
          type: object
          properties:
            totalBytes: { type: integer, minimum: 0 }
            usedBytes: { type: integer, minimum: 0 }
            availableBytes: { type: integer, minimum: 0 }
            freeBytes: { type: integer, minimum: 0 }
            cachedBytes: { type: integer, minimum: 0 }
            buffersBytes: { type: integer, minimum: 0 }
            activeBytes: { type: integer, minimum: 0 }
            inactiveBytes: { type: integer, minimum: 0 }
            usagePercent: { type: number, minimum: 0, maximum: 100 }
            swap:
              type: object
              properties:
                totalBytes: { type: integer, minimum: 0 }
                usedBytes: { type: integer, minimum: 0 }
                freeBytes: { type: integer, minimum: 0 }
                usagePercent: { type: number, minimum: 0, maximum: 100 }
                bytesIn: { type: integer, minimum: 0 }
                bytesOut: { type: integer, minimum: 0 }
        disk:
          $ref: '#/components/schemas/ServerDiskResource'
        partitions:
          type: array
          items: { $ref: '#/components/schemas/ServerDiskResource' }
        diskIO:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              readBytes: { type: integer, minimum: 0 }
              writeBytes: { type: integer, minimum: 0 }
              readOperations: { type: integer, minimum: 0 }
              writeOperations: { type: integer, minimum: 0 }
              readTimeMs: { type: integer, minimum: 0 }
              writeTimeMs: { type: integer, minimum: 0 }
              ioOperationsInProgress: { type: integer, minimum: 0 }
        network:
          type: object
          properties:
            bytesSent: { type: integer, minimum: 0 }
            bytesReceived: { type: integer, minimum: 0 }
            packetsSent: { type: integer, minimum: 0 }
            packetsReceived: { type: integer, minimum: 0 }
            errorsIn: { type: integer, minimum: 0 }
            errorsOut: { type: integer, minimum: 0 }
            dropsIn: { type: integer, minimum: 0 }
            dropsOut: { type: integer, minimum: 0 }
            interfaces:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  hardwareAddress: { type: string }
                  mtu: { type: integer, minimum: 0 }
                  flags: { type: array, items: { type: string } }
                  addresses: { type: array, items: { type: string } }
                  bytesSent: { type: integer, minimum: 0 }
                  bytesReceived: { type: integer, minimum: 0 }
                  packetsSent: { type: integer, minimum: 0 }
                  packetsReceived: { type: integer, minimum: 0 }
                  errorsIn: { type: integer, minimum: 0 }
                  errorsOut: { type: integer, minimum: 0 }
                  dropsIn: { type: integer, minimum: 0 }
                  dropsOut: { type: integer, minimum: 0 }
            connections:
              type: object
              properties:
                available: { type: boolean }
                sampled: { type: integer, minimum: 0 }
                truncated: { type: boolean }
                tcp: { type: integer, minimum: 0 }
                udp: { type: integer, minimum: 0 }
                established: { type: integer, minimum: 0 }
                listen: { type: integer, minimum: 0 }
                timeWait: { type: integer, minimum: 0 }
                closeWait: { type: integer, minimum: 0 }
        process:
          type: object
          properties:
            pid: { type: integer, minimum: 1 }
            goVersion: { type: string }
            goroutines: { type: integer, minimum: 1 }
            threads: { type: integer, minimum: 0 }
            cpuUsagePercent: { type: number, minimum: 0 }
            allocatedBytes: { type: integer, minimum: 0 }
            systemBytes: { type: integer, minimum: 0 }
            heapInUseBytes: { type: integer, minimum: 0 }
            heapObjects: { type: integer, minimum: 0 }
            gcCycles: { type: integer, minimum: 0 }
            residentBytes: { type: integer, minimum: 0 }
            virtualBytes: { type: integer, minimum: 0 }
            readBytes: { type: integer, minimum: 0 }
            writeBytes: { type: integer, minimum: 0 }
            openFileDescriptors: { type: integer, minimum: 0 }
            uptimeSeconds: { type: integer, minimum: 0 }
        temperatures:
          type: array
          items:
            type: object
            properties:
              sensorKey: { type: string }
              temperatureCelsius: { type: number }
              highCelsius: { type: number }
              criticalCelsius: { type: number }
        health:
          type: object
          required: [status, score, alerts]
          properties:
            status: { type: string, enum: [healthy, warning, critical] }
            score: { type: integer, minimum: 0, maximum: 100 }
            alerts:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  severity: { type: string, enum: [warning, critical] }
                  title: { type: string }
                  message: { type: string }
        collectionWarnings:
          type: array
          items: { type: string }
        sampledAt: { type: string, format: date-time }
    ServerDiskResource:
      type: object
      required: [device, path, fileSystem, totalBytes, usedBytes, freeBytes, usagePercent, inodesTotal, inodesUsed, inodesUsagePercent]
      properties:
        device: { type: string }
        path: { type: string }
        fileSystem: { type: string }
        totalBytes: { type: integer, minimum: 0 }
        usedBytes: { type: integer, minimum: 0 }
        freeBytes: { type: integer, minimum: 0 }
        usagePercent: { type: number, minimum: 0, maximum: 100 }
        inodesTotal: { type: integer, minimum: 0 }
        inodesUsed: { type: integer, minimum: 0 }
        inodesUsagePercent: { type: number, minimum: 0, maximum: 100 }
