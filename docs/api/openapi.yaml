openapi: 3.1.0
info:
  title: 采集数据管理平台 API
  version: 1.0.0
  description: 管理端使用 Cookie 会话鉴权；公开门户内容默认匿名可读，B 端标记为 18R 的内容只有在 C 端请求同时携带有效会话和后端域 portal-r18=1 偏好 Cookie 时才包含，图片点赞和评论写入要求有效会话。
servers:
  - url: http://localhost:8080
    description: 本地后端服务
tags:
  - name: 认证
  - name: 公开门户
  - name: 用户
  - name: 管理
  - name: 内容
  - name: 文件
  - name: 内部聊天
  - name: 客服聊天
  - name: 访问分析
  - name: 服务器
paths:
  /api/public/articles:
    get:
      tags: [公开门户]
      summary: 获取公开文章列表
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 按标题与摘要模糊搜索 }
        - { name: category, in: query, schema: { type: string }, description: 按分类名称筛选 }
        - { name: sort, in: query, schema: { type: string }, description: 当前会解析但暂不影响排序，结果固定按 ID 倒序 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200': { description: 公开文章分页列表 }
  /api/public/articles/{id}:
    get:
      tags: [公开门户]
      summary: 获取公开文章详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 文章正文、目录与相关文章 }
        '404': { description: 文章不存在或未公开 }
  /api/public/images:
    get:
      tags: [公开门户]
      summary: 获取公开图片列表
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string }, description: 当前会解析但暂不影响排序，结果固定按 ID 倒序 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200': { description: 公开图片分页列表；每项包含 tags、ownerName（上传人展示名称）和 views（公开预览浏览量） }
  /api/public/dailies:
    get:
      tags: [公开门户]
      summary: 获取公开日常列表
      description: 匿名请求返回所有公开日常；登录请求额外返回当前用户自己的私密日常。支持 keyword、page 和 pageSize，默认每页 24 条、最多 50 条。
      security: [{ cookieSession: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 按日常正文或发布人展示名称模糊搜索 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200':
          description: 日常分页列表
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicDaily' }
                  pagination: { $ref: '#/components/schemas/PublicPagination' }
    post:
      tags: [公开门户]
      summary: 发布一条日常
      description: 仅登录用户可发布；正文经过白名单清洗后以富文本 HTML 保存，用户可见文字去首尾空白后最多 2000 个 Unicode 字符，isPrivate=true 时仅发布人本人可见。
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicDailyRequest' }
      responses:
        '201':
          description: 日常发布成功
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/PublicDaily' }
        '400': { description: 日常为空或超过 2000 个 Unicode 字符 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/dailies/{id}:
    get:
      tags: [公开门户]
      summary: 获取日常详情
      description: 仅返回当前访客可见的日常，并在成功读取时原子增加一次浏览量。
      security: [{ cookieSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 日常详情
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/PublicDaily' }
        '404': { description: 日常不存在、私密或当前访客无权查看 }
  /api/public/resources:
    get:
      tags: [公开门户]
      summary: 获取公开资源文件列表
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string }, description: 当前会解析但暂不影响排序，结果固定按 ID 倒序 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses:
        '200': { description: 公开资源分页列表 }
  /api/public/files/{id}/preview:
    get:
      tags: [公开门户]
      summary: 获取公开文件预览
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 预览媒体内容 }
        '404': { description: 文件不存在或未公开 }
  /api/public/files/{id}/thumbnail:
    get:
      tags: [公开门户]
      summary: 获取公开图片缩略图
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: JPEG 缩略图流 }
        '404': { description: 文件不存在、未公开或非图片 }
  /api/public/files/{id}/medium:
    get:
      tags: [公开门户]
      summary: 获取公开图片屏幕适配中图
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 最大宽度 1280 像素、质量 85 的 JPEG 图片流 }
        '404': { description: 文件不存在、未公开或非图片 }
  /api/public/files/{id}/download:
    get:
      tags: [公开门户]
      summary: 下载公开文件
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 文件下载流 }
        '404': { description: 文件不存在或未公开 }
  /api/public/files/{id}/interactions:
    get:
      tags: [公开门户]
      summary: 获取公开图片点赞和评论
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 点赞总数、当前登录用户点赞状态和最近一百条评论
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFileInteraction' }
        '404': { description: 图片不存在、未公开或被当前 18R 可见性过滤 }
  /api/public/files/{id}/like:
    post:
      tags: [公开门户]
      summary: 切换当前登录用户的图片点赞
      security: [{ cookieSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 点赞切换后的权威互动状态；每个账号对每张图片最多一个点赞，再次调用会取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFileInteraction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 图片不存在、未公开或被当前 18R 可见性过滤 }
  /api/public/files/{id}/tags:
    post:
      tags: [公开门户]
      summary: 为公开图片追加标签
      description: 登录用户可追加一个标签；不会覆盖或删除已有标签，重复标签或达到十二个标签上限时返回 added=false。
      security: [{ cookieSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicFileTagRequest' }
      responses:
        '200':
          description: 图片当前权威标签与本次实际新增状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFileTagResponse' }
        '400': { description: 标签为空 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 图片不存在、未公开或被当前 18R 可见性过滤 }
  /api/public/files/{id}/comments:
    post:
      tags: [公开门户]
      summary: 发送公开图片评论
      security: [{ cookieSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicFileCommentRequest' }
      responses:
        '201':
          description: 评论创建成功
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/PublicFileComment' }
        '400': { description: 评论为空或超过 500 个 Unicode 字符 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 图片不存在、未公开或被当前 18R 可见性过滤 }
  /api/public/categories:
    get:
      tags: [公开门户]
      summary: 获取公开分类聚合信息
      responses:
        '200': { description: 各分类下的文章、图片与资源数量 }
  /api/public/site-summary:
    get:
      tags: [公开门户]
      summary: 获取站点聚合概览
      responses:
        '200': { description: 文章、图片与资源总数 }
  /api/public/search:
    get:
      tags: [公开门户]
      summary: 聚合搜索公开内容
      parameters:
        - { name: keyword, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 聚合搜索结果（文章、图片、资源） }
  /health:
    get:
      summary: 检查后端健康状态
      responses:
        '200':
          description: 后端服务已就绪。
  /api/auth/login:
    post:
      tags: [认证]
      summary: 创建登录会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: 登录成功并已设置会话 Cookie。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/session:
    get:
      tags: [认证]
      summary: 获取当前会话用户
      responses:
        '200': { description: 当前已登录用户及其权限，以及 r18Enabled 可见性偏好。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/portal-r18:
    post:
      tags: [认证]
      summary: 更新当前会话的 18R 内容可见性偏好
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: 偏好已写入后端域 portal-r18 Cookie。 }
        '400': { description: 请求参数无效。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [认证]
      summary: 删除当前会话
      responses:
        '204': { description: 会话已删除且 Cookie 已过期。 }
  /api/users:
    get:
      tags: [用户]
      summary: 查询用户列表
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 已授权用户列表。 }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [用户]
      summary: 创建用户
      security: [{ cookieSession: [] }]
      responses:
        '201': { description: 用户创建成功。 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/departments:
    get:
      tags: [管理]
      summary: 查询部门列表
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 部门列表。 }
    post:
      tags: [管理]
      summary: 创建部门
      security: [{ cookieSession: [] }]
      responses:
        '201': { description: 部门创建成功。 }
  /api/roles:
    get:
      tags: [管理]
      summary: 查询角色列表
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 角色列表。 }
    post:
      tags: [管理]
      summary: 创建角色
      security: [{ cookieSession: [] }]
      responses:
        '201': { description: 角色创建成功。 }
  /api/menus:
    get:
      tags: [管理]
      summary: 查询有效菜单
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 当前用户可见菜单列表。 }
    post:
      tags: [管理]
      summary: 创建菜单
      security: [{ cookieSession: [] }]
      responses: { '201': { description: 菜单创建成功。 } }
  /api/data-points:
    get:
      tags: [访问分析]
      summary: 查询工作台指标
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 工作台指标列表。 }
    post:
      tags: [访问分析]
      summary: 创建工作台指标
      security: [{ cookieSession: [] }]
      responses:
        '201': { description: 指标创建成功。 }
  /api/server/metrics:
    get:
      tags: [服务器]
      summary: 查询后端运行环境资源快照
      description: 需要预览台菜单和 dashboard.view 动作；返回硬件、内核、资源、网络、进程和健康检查快照。Docker 部署返回后端容器视角，平台或权限不支持的扩展项记录在 collectionWarnings。
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: CPU、负载、内存、交换区、文件系统、磁盘 I/O、网络、连接、温度、后端进程和健康状态快照。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerMetrics' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/server/connections:
    get:
      tags: [服务器]
      summary: 按需查询服务器网络连接明细
      description: 需要预览台菜单和 dashboard.view 动作；点击活动连接指标时调用。最多枚举 5000 个套接字并返回按诊断优先级排列的前 500 条明细，包含协议、地址族、本地/远端端点、状态、PID 和权限允许时的进程名；平台或权限不支持枚举时以 available=false 和 warning 结构化降级。
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: 当前网络连接汇总及受限数量的连接明细。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerConnectionDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/server/terminal:
    get:
      tags: [服务器]
      summary: 建立登录用户 SSH 终端 WebSocket
      description: 任意有效登录会话均可升级，匿名请求仍会被拒绝；每个 WebSocket 对应一个独立 SSH 终端，前端可同时打开多个连接并在同一连接中保留多个文件编辑标签。连接凭据不持久化，首次握手必须确认 SHA256 主机指纹。连接后可通过同一通道的 list_dir、read_file、search 和 write_file 消息浏览 SFTP 目录、读取文件，以及编辑保存不超过 1 MiB 的现有 UTF-8 普通文本文件；read_file 还可返回不超过 10 MiB 的 PNG、JPEG、GIF、WebP、BMP、SVG 图片或 PDF Base64 预览。前端采用当前目录步进浏览和本层过滤搜索；Bash/Zsh 提示符通过标准 OSC 7 报告实际工作目录，使终端路径变更自动刷新左侧目录，协议仍保留从根目录递归搜索能力。目录单次最多返回 2000 项；递归搜索最多扫描 10000 个节点并返回 200 项；写入受远端 SSH 账号文件权限约束。
      security: [{ cookieSession: [] }]
      responses:
        '101': { description: WebSocket 升级成功。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/register/code:
    post:
      tags: [认证]
      summary: 发送公开注册邮箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCodeRequest' }
      responses:
        '200': { description: 验证码已发送。 }
        '409': { description: 用户名已存在。 }
  /api/auth/register:
    post:
      tags: [认证]
      summary: 校验邮箱并创建最低权限普通用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: 注册成功。 }
        '400': { description: 验证码或注册信息无效。 }
        '409': { description: 用户名已存在。 }
  /api/server/host-terminal:
    get:
      tags: [服务器]
      summary: 建立超级管理员部署机直连 WebSocket
      description: 仅 roleCode=super-admin 的有效登录会话可升级；后端为每个浏览器标签分配临时会话，并通过已认证宿主机代理转发 PTY、目录、搜索、文件读取和文本保存消息。该模式不使用 SSH 或 22 端口，命令与文件权限等于运行代理的 Linux 系统账号，保存文件时允许跟随符号链接到普通目标文件，代理离线时返回明确错误。
      security: [{ cookieSession: [] }]
      responses:
        '101': { description: WebSocket 升级成功。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/server/host-agent:
    get:
      tags: [服务器]
      summary: 注册 Linux 宿主机终端代理 WebSocket
      description: 独立宿主机代理使用与后端 HOST_AGENT_TOKEN 一致的 Bearer 令牌主动连接；每个后端实例同时接受一个代理，并通过随机临时会话 ID 复用最多 32 个浏览器终端。令牌为空时功能禁用，令牌和终端内容不会写入日志或数据库。
      security: [{ hostAgentBearer: [] }]
      responses:
        '101': { description: 宿主机代理注册成功。 }
        '401': { description: 代理令牌无效。 }
        '503': { description: 后端尚未配置宿主机代理令牌。 }
  /api/visitor-analytics:
    get:
      tags: [访问分析]
      summary: 查询最新访问记录和聚合数据
      description: 仅具有访问分析权限的系统管理员和超级管理员可以访问。
      security: [{ cookieSession: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d, 30d] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 20, 30, 50, 100], default: 10 } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: statusCode, in: query, schema: { type: integer } }
      responses:
        '200': { description: 按最新优先排列的访问记录和图表聚合数据。 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/articles:
    get:
      tags: [内容]
      summary: 查询可见文章
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 按所有权和隐私规则过滤后的文章列表。 }
    post:
      tags: [内容]
      summary: 创建文章
      security: [{ cookieSession: [] }]
      responses:
        '201': { description: 文章创建成功。 }
  /api/files:
    get:
      tags: [文件]
      summary: 查询可见文件和受保护聊天数据
      security: [{ cookieSession: [] }]
      responses:
        '200': { description: 按来源和分类分组的文件列表。 }
    post:
      tags: [文件]
      summary: 上传文件管理资源
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                displayName: { type: string, description: 管理端展示名称；为空时使用原始文件名 }
                category: { type: string, description: 管理端分类 }
                description: { type: string, description: 文件说明 }
                tags: { type: string, description: 逗号或分号分隔的标签；最多 12 个，每个最多 24 个 Unicode 字符 }
                isPrivate: { type: boolean, default: false, description: 是否私密 }
                is18r: { type: boolean, default: false, description: 是否标记为 18R }
      responses:
        '201': { description: 文件已保存且元数据已持久化；文件管理接口不设置应用层单文件大小上限。 }
        '409':
          description: 同一所有者已存在内容相同且未删除的文件。
          content:
            application/json:
              schema:
                type: object
                required: [code, error, existingFile]
                properties:
                  code: { type: string, enum: [DUPLICATE_FILE] }
                  error: { type: string }
                  existingFile:
                    type: object
                    required: [id, displayName, originalName]
                    properties:
                      id: { type: integer }
                      displayName: { type: string }
                      originalName: { type: string }
