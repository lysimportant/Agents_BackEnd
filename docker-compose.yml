services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_PORT: "${BACKEND_INTERNAL_PORT:-8080}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
    environment:
      SQLITE_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
      SERVER_ADDRESS: ":${BACKEND_INTERNAL_PORT:-8080}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-Lax}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-sessionId}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-8}"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      PASSWORD_CODE_TTL_SECONDS: "${PASSWORD_CODE_TTL_SECONDS:-180}"
      VISITOR_LOG_RETENTION_DAYS: "${VISITOR_LOG_RETENTION_DAYS:-90}"
      HOST_AGENT_TOKEN: "${HOST_AGENT_TOKEN:-}"
      EMAIL_CONFIG_PATH: /app/email.txt
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-}"
      EMAIL_SECURE: "${EMAIL_SECURE:-}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASS: "${EMAIL_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
    volumes:
      - "${DATA_DIR:-./backend/data}:/app/data"
      - "${UPLOAD_DIR:-./backend/uploads}:/app/uploads"
      - "${EMAIL_CONFIG_FILE:-./email.txt}:/app/email.txt:ro"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://127.0.0.1:$${BACKEND_INTERNAL_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:8080}"
        NEXT_PUBLIC_SITE_URL: "${FRONTEND_SITE_URL:-http://localhost:3000}"
        BACKEND_INTERNAL_URL: "http://backend:${BACKEND_INTERNAL_PORT:-8080}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:8080}"
      NEXT_PUBLIC_SITE_URL: "${FRONTEND_SITE_URL:-http://localhost:3000}"

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PORTAL_API_BASE_URL:-http://localhost:8080}"
        NEXT_PUBLIC_SITE_URL: "${PORTAL_SITE_URL:-http://localhost:3001}"
        NEXT_PUBLIC_ENABLE_CUSTOMER_CHAT: "${PORTAL_ENABLE_CUSTOMER_CHAT:-false}"
        PORTAL_REVALIDATE_SECONDS: "${PORTAL_REVALIDATE_SECONDS:-60}"
        PORTAL_INTERNAL_PORT: "${PORTAL_INTERNAL_PORT:-3001}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-3001}:${PORTAL_INTERNAL_PORT:-3001}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${PORTAL_API_BASE_URL:-http://localhost:8080}"
      NEXT_PUBLIC_SITE_URL: "${PORTAL_SITE_URL:-http://localhost:3001}"
      NEXT_PUBLIC_ENABLE_CUSTOMER_CHAT: "${PORTAL_ENABLE_CUSTOMER_CHAT:-false}"
      BACKEND_INTERNAL_URL: "http://backend:${BACKEND_INTERNAL_PORT:-8080}"
      PORTAL_REVALIDATE_SECONDS: "${PORTAL_REVALIDATE_SECONDS:-60}"
      PORT: "${PORTAL_INTERNAL_PORT:-3001}"

volumes:
  redis-data:
